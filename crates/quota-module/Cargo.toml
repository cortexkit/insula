[package]
name = "quota-module"
version = "0.1.0"
edition = "2021"
publish = false
description = "The ai-provider-quota subc module: registers a ManagementSurface, answers usage.get over the subc wire with ProviderUsage[]."

[[bin]]
name = "ck-quota"
path = "src/main.rs"

[dependencies]
quota-core = { path = "../quota-core" }
subc-protocol = { workspace = true }
subc-transport = { workspace = true }
subc-jsonc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
subc-core = { workspace = true }
