[package]
name = "quota-module"
version = "0.1.1"
edition = "2021"
publish = false
description = "The insula subc module: registers a ManagementSurface and answers usage.get over the subc wire with ProviderUsage[]."
license = "MIT"
repository = "https://github.com/cortexkit/insula"

# The binary name is the process name an operator sees in Activity Monitor, so
# it tracks the module's own name rather than the crate's. Renaming it also
# renames the CARGO_BIN_EXE_* env var the integration tests use to locate the
# built binary, which is why those fail to compile if this changes alone.
#
# It does NOT move any of this module's on-disk paths: the redemption journal,
# the quota config, and the vault handle file each come from their own hardcoded
# literal spelled `ck-quota`. Those are load-bearing and deliberately unchanged.
[[bin]]
name = "ck-insula"
path = "src/main.rs"

[dependencies]
quota-core = { path = "../quota-core" }
subc-protocol = { workspace = true }
subc-transport = { workspace = true }
subc-jsonc = { workspace = true }
subc-os = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
base64 = "0.22"
cortexkit-bus-naming = "=0.2.1"
cortexkit-bus-nats = "=0.3.0"
cortexkit-bus-trait = "=0.3.0"
cortexkit-claustrum-client = "=0.4.0"
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "nkeys", "nuid", "ring", "server_2_10"] }

# build.rs stamps a lock digest that the manifest publishes as provenance, and
# subc-protocol validates it as exactly 64 lowercase hex -- a real SHA-256 rather
# than a hash whose width happens to fit. sha2 is already in the dependency graph
# for the runtime, so this adds no new third-party surface.
[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
# The quota-wire vector test hashes its generated files for SHA256SUMS
# in-process, so it also runs where no `shasum` command exists (Windows).
sha2 = { workspace = true }
nkeys = "=0.4.5"
cortexkit-bus-testkit = "=0.1.1"
cortexkit-paths = "=0.1.2"
# For the diagnostic examples only: the module itself makes no HTTP calls.
reqwest = { workspace = true }
# The fleet's shared test helper: copies a built binary to a content-addressed
# `ckdev-*` file on the internal disk, which the integration tests then spawn
# (tests/common/mod.rs).
cortexkit-test-support = "=0.1.10"
subc-daemon = { workspace = true }
