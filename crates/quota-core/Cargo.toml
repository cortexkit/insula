[package]
name = "quota-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Provider usage fetchers + RateWindow normalization + TTL cache for the ai-provider-quota subc module. Pure logic, wire-agnostic."

[dependencies]
cortexkit-provider-usage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
pbkdf2 = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
base64 = "0.22"
libc = "0.2"

# Linux only: reading a `v11` cookie needs Chrome's storage password, which
# lives in the Secret Service and is reachable only over D-Bus. Gated to Linux
# so no other platform pays for the zbus stack, and pinned to the pure-Rust
# crypto feature to avoid dragging in a C OpenSSL build.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1", default-features = false, features = [
    "rt-tokio-crypto-rust",
] }
