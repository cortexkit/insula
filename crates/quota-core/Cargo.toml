[package]
name = "quota-core"
version = "0.1.1"
edition = "2021"
publish = false
description = "Provider usage fetchers and rate-window normalization for the insula subc module. Pure logic, wire-agnostic."
license = "MIT"
repository = "https://github.com/cortexkit/insula"

[dependencies]
cortexkit-provider-usage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
# `process` for the bounded `ps`/`lsof` children in subprocess.rs.
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
base64 = "0.22"
serde_ignored = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
