[package]
name = "quota-core"
version = "0.1.1"
edition = "2021"
publish = false
description = "Provider usage fetchers and rate-window normalization for the insula subc module. Pure logic, wire-agnostic."
license = "MIT"
repository = "https://github.com/cortexkit/insula"

[dependencies]
cortexkit-paths = "=0.1.2"
cortexkit-lease = "=0.1.3"
cortexkit-provider-usage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
# `process` for the bounded `ps`/`lsof` children in subprocess.rs.
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
base64 = "0.22"
serde_ignored = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
