[workspace]
resolver = "2"
members = ["crates/quota-core", "crates/quota-module"]

# ai-provider-quota — a subc-supervised module serving per-provider usage/quota
# windows, replacing the external CodexBar dependency. See docs/charter.md.
#
# The subc crates come from crates.io: a sibling release cannot rewrite our lock.
# We take upgrades deliberately with `cargo update -p <crate>` (and bump the
# requirement for a new minor). subc-protocol/subc-transport are the module-facing
# wire; subc-daemon is dev-only for the in-process skeleton test. The TS
# @cortexkit/subc-client consumer transport is owned by subc, NOT built here.
[workspace.dependencies]
subc-protocol = "0.30"
subc-transport = "0.11"
subc-daemon = "0.33"
subc-jsonc = "0.1"
# `subc_os::launch_nonce()` is the one reader of the launch nonce the daemon hands
# a supervised module on descriptor 3. It must be the only reader in the process:
# it closes the descriptor after reading, so a second reader would hit whatever
# the process opened next at that number.
subc-os = "0.1"

# The shared usage.get wire types (ProviderUsage/Usage/RateWindow + account/reset
# metadata), extracted to cortexkit/commons so every consumer (ALF's router,
# astrocyte's capacity axis, the ck CLI renderer) compiles against one definition.
# Published on crates.io (cortexkit/commons); CI fetches it like any other dep.
cortexkit-provider-usage = "0.11"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

# Cursor's app store (`state.vscdb`) is a SQLite file.
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
