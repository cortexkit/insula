[workspace]
resolver = "2"
members = ["crates/quota-core", "crates/quota-module"]

# ai-provider-quota — a subc-supervised module serving per-provider usage/quota
# windows, replacing the external CodexBar dependency. See docs/charter.md.
#
# The subc wire contract crates are PATH dependencies on the sibling subconscious
# monorepo (same arrangement AFT uses): subc-protocol/subc-transport are the
# module-facing wire, subc-core is a dev-only dep for the in-process daemon used
# in the end-to-end skeleton test. The TS @cortexkit/subc-client (Alfonso's
# consumer transport) is owned by subc, NOT built here.
[workspace.dependencies]
subc-protocol = { path = "../subconscious/crates/subc-protocol" }
subc-transport = { path = "../subconscious/crates/subc-transport" }
subc-core = { path = "../subconscious/crates/subc-core" }
subc-jsonc = { path = "../subconscious/crates/subc-jsonc" }

# The shared usage.get wire types (ProviderUsage/Usage/RateWindow + account/reset
# metadata), extracted to cortexkit/commons so every consumer (ALF's router,
# astrocyte's capacity axis, the ck CLI renderer) compiles against one definition.
# Published on crates.io (cortexkit/commons); CI fetches it like any other dep.
cortexkit-provider-usage = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

# Browser-cookie extraction (the 7-provider cookie cohort, macOS Chrome path):
# read Chrome's sqlite cookie store + decrypt v10 values
# (PBKDF2-HMAC-SHA1 -> AES-128-CBC, with a SHA256(host_key) plaintext prefix).
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
