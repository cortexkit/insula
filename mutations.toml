# Costly safety and wire guards, generated by ckdev-mutate prove (0.8.0).
# The pinned runner's default build/test deadlines stop hangs; they are not
# performance budgets. Set budgets only after measuring on clean CI runners.
# With --broad, these quota-module rows also run the skeleton_e2e tests, which
# spawn the built ck-insula binary:
#   route-identity-module-id, route-identity-launch-nonce, wire-list-scoped-type,
#   manifest-trust-tier, manifest-bindings-absent, manifest-consumes-vault,
#   manifest-provides-routed, manifest-self-signals-mutator.
# Without rebuilding ck-insula after a source edit, those tests would exercise
# an old binary instead of the mutant. The prebuild command below refreshes it:
#   cargo build -p quota-module --bins --locked
# ckdev-mutate runs it before baselines, after mutant builds and on restoration.
prebuild = [
  { name = "module-fixture", command = ["cargo", "build", "-p", "quota-module", "--bins", "--locked"] },
]


